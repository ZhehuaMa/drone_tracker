# AR0234 software-trigger template: waits for ON; fill all model paths first.
# Camera intrinsics are simulated, not measured lens calibration. Before deployment, use
# v4l2-ctl --list-devices and media-ctl -p to verify device topology, sensor and format.
drone_tracker_node:
  ros__parameters:
    diagnostics:
      mode: "off"
      socket: /run/drone_tracker/diagnostics.sock
    # ROS bag switch for RK3576 camera/video; a failure affects only this round's bag.
    need_save: false
    # Each round creates a new child directory; verify write access and free space first.
    save_path: "/tmp/drone-recordings"
    # Live debug image switch. RK3576 bags exclude /fpv/tracker_image in every setting.
    visualized_result: false
    publish_prediction: false
    los.rate_filter_tau: 0.12
    # Independent SC233HGS H.264/TS recording; separate from need_save, ROS images and HDMI.
    # Enable only for SC233HGS continuous capture after verifying a local ext4 directory.
    recording:
      enabled: false
      directory: /var/lib/drone_tracker/recordings
      bitrate_bps: 12000000
      segment_seconds: 60
      sync_interval_ms: 1000  # Only 500, 1000 or 2000; this is not a maximum power-loss window.
      max_total_bytes: 21474836480  # 20 GiB including incomplete sessions and sidecars.
      min_free_bytes: 5368709120  # 5 GiB reserve; stop recording at the limit without deleting history.
    # HDMI is independent of ROS debug images. All osd parameters are startup-only.
    osd:
      render_path: cached-overlay # Set legacy and restart to select the renderer fallback.
      enabled: false
      timing_enabled: false  # Display-stage timing; restart after changing this value.
      drm_device: "/dev/dri/card0"
      connector: "HDMI-A-1"
      width: 720
      height: 480
      refresh_hz: 60.0
      frame_stale_ms: 1000
      telemetry_timeout_ms: 2000
      craft_name: "FPV"
      battery_cells: 0  # Zero means unknown; do not infer cell count from voltage.
    use_history_timestamp: false
    use_sim_time: false
    # Simulated intrinsics for 1920x1200 input, in source pixels.
    # fx/fy=1333.3 are chosen integration values; cx/cy are the image center.
    # These values do not establish calibration or rotation accuracy. Replace after calibration.
    camera:
      fx: 1333.3
      fy: 1333.3
      cx: 960.0
      cy: 600.0
    tracker:
      # Supply four explicit files; relative paths resolve below package share/models.
      yolo_engine: ""
      nano_backbone: ""  # The shared Backbone field must be empty on RK3576.
      nano_template_backbone: ""  # Template image feature model.
      nano_search_backbone: ""  # Search image feature model.
      nano_head: ""  # Template/search feature matching model.
      # One exact zero-based target class: only cid == yolo_target_class_id.
      yolo_target_class_id: 0
      # Detector thresholds retain the configured board tuning. Remaining values control
      # the public hybrid tracker; consult its current algorithm review for semantics.
      yolo_conf_threshold: 0.5
      yolo_nms_threshold: 0.45
      yolo_interval: 4
      yolo_recall_relax_ratio: 1.0   # ROI confidence multiplier; 1.0 leaves the threshold unchanged.
      iou_reset_threshold: 0.4       # Re-anchor when overlap is below this threshold.
      iou_calibrate_threshold: 0.8   # YOLO agreement threshold; confirmation does not overwrite the track.
      max_position_jump: 150.0       # Absolute center-jump threshold in input pixels.
      max_size_jump_ratio: 2.0
      max_box_area_ratio: 0.8
      tracking_roi_scale_factor: 2.0
      lost_max_count: 5              # Consecutive unconfirmed results: no target, low-IoU recovery or unaccepted jumps.
                                     # Counts detector results, not a guaranteed frame count or wall-clock duration.
      frame_buffer_size: 30
      jump_tolerance: 3
      enable_dcf: false              # False uses the center Kalman filter; true enables grayscale DCF fusion.
                                     # The center filter uses kf_r_pos/kf_q_a; rotation-KF output remains separate.
      dcf_fixed_template: true
      dcf_learning_rate: 0.01
      dcf_lambda: 0.0001
      dcf_psr_thresh: 5.0
      dcf_max_div_factor: 0.5        # Center divergence threshold shared by DCF and center-filter paths.
      # Rotation-compensated Kalman noise. r_pos/q_a also configure center smoothing
      # when enable_dcf=false.
      kf_r_pos: 4.0
      kf_r_size: 4.0
      kf_q_a: 50000.0
      kf_q_size: 1000.0
    mv_camera:
      # Verify this topology and image size at deployment; these are explicit inputs.
      # Choose ar0234 or sc233hgs. SC233HGS supports continuous mode only.
      sensor_model: ar0234
      capture_mode: software_trigger
      trigger_rate_hz: 20.0  # Software command rate, independent of device fps; continuous requires zero.
      media_device: /dev/media0
      sensor_entity: "m00_b_mvcam 4-003b"  # Replace with the entity reported by media-ctl -p.
      # For SC233HGS, use an rkisp_mainpath node already prepared by ISP/3A.
      # media_device and sensor_entity identify the configuration; they do not configure media-ctl.
      # Use the dedicated rk3576_sc233hgs_production_params.yaml template for that sensor.
      # Recheck its current device paths rather than copying historical mappings.
      # A historical /dev/video22 setup used 1920x1200 single-plane NV12, Y stride 1920.
      # sensor_model: sc233hgs
      # capture_mode: continuous
      # trigger_rate_hz: 0.0
      # media_device: /dev/media0
      # sensor_entity: "m00_b_sc233hgs 0-0030"
      buffer_count: 4
      width_px: 1920
      height_px: 1200
      fps: 60  # Device frame rate, independent of software command rate.
      output_width_px: 0  # Zero keeps the actual input size.
      output_height_px: 0
      flip: false
      mirror: false
      pixel_size_um: 3.0  # RK3576 does not derive camera intrinsics from this field.
      focal_length_mm: 4.0
