drone_tracker_node:
  ros__parameters:
    use_history_timestamp: false
    tracker:
      yolo_engine: "balloon_int8.engine"
      nano_backbone: "nanotrackv3_backbone_int8.engine"
      nano_head: "nanotrack_head_int8.engine"
      yolo_target_class_id: 0
      yolo_conf_threshold: 0.4
      yolo_nms_threshold: 0.45
      yolo_interval: 2
      yolo_recall_relax_ratio: 0.75
      iou_reset_threshold: 0.3
      iou_calibrate_threshold: 0.6
      tracking_conf_threshold: 0.8
      tracking_roi_scale_factor: 2.0
      lost_max_count: 30
    mv_camera:
      # settings for MV-IMX264M
      #   flip: true
      #   mirror: true
      #   fps: 30
      #   output_width_px: 640
      #   output_height_px: 640
      #   # native parameters for camera
      #   width_px: 1920
      #   height_px: 1920
      #   focal_length_mm: 12.0
      #   pixel_size_um: 3.45
      # settings for MV-IMX265M
      flip: false
      mirror: false
      fps: 50
      output_width_px: 960
      output_height_px: 960
      # native parameters for camera
      width_px: 1520
      height_px: 1520
      focal_length_mm: 10.0
      pixel_size_um: 3.45
    ekf:
      estimated_imu_freq: 100
      estimated_latency: 0.08
      process_noise_std: [0.5, 0.5, 1.0, 1.0]
      measurement_noise_std: [3.0, 3.0]
